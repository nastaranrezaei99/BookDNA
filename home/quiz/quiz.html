<!DOCTYPE html>
<html>

<head>

    <meta charset='utf-8'>

    <title>Book DNA</title>

    <!--responsives design-->
    <meta name='viewport' content='width=device-width'>


    <link rel='stylesheet' type='text/css' href='design.css'>

</head>

<body>
    <form id="firstque">
        <div class="step1" id="step1">
            <h2 id="question1"> 1. What kind of book are you looking for?</h2>
            <div>
                <input type="radio" name="q1" id="q11" value="history">
                <label for="q11">A story connected to the past or society</label><br>
            </div>
            <div>
                <input type="radio" name="q1" id="q12" value="poetry">
                <label for="q12">A text with deep feelings and atmosphere</label><br>
            </div>
            <div>
                <input type="radio" name="q1" id="q13" value="classic">
                <label for="q13">A well-known and timeless book</label><br>
            </div>
            <div>

                <button type="button" id="button1">Next</button>

            </div>
            <!-- <img src="img1.png" id="dosto"> -->
        </div>

    </form>

    <form id="secque">
        <div class="step2" id="step2">
            <h2 id="question2"> 2. What interests you most while reading? </h2>

            <div>
                <input type="radio" name="q2" id="q21" value="classic">
                <label for="q21">Important ideas and human questions</label><br>
            </div>
            <div>
                <input type="radio" name="q2" id="q22" value="history">
                <label for="q22">Historical events and real contexts</label><br>
            </div>
            <div>
                <input type="radio" name="q2" id="q23" value="poetry">
                <label for="q23">Emotions, language and inner thoughts</label><br>
            </div>


            <div>
                <button type="button" id="button22">Back</button>
                <button type="button" id="button2">Next</button>



            </div>
        </div>
    </form>

    <form id="thirdque">
        <div class="step3" id="step3">
            <h2 id="question3"> 3. Which reading experience do you prefer? </h2>


            <div>
                <input type="radio" name="q3" id="q31" value="classic">
                <label for="q31">Something thoughtful and meaningful</label>
            </div>

            <div>
                <input type="radio" name="q3" id="q32" value="history">
                <label for="q32">Something that shows another time or culture</label>
            </div>

            <div>
                <input type="radio" name="q3" id="q33" value="poetry">
                <label for="q33">Something emotional and personal</label>
            </div>


            <div>
                <button type="button" id="button32">Back</button>
                <button type="button" id="button3">Next</button>

            </div>
        </div>
    </form>

    <form id="f4que">


        <div class="step4" id="step4">
            <h2 id="question4"> 4. What should a good book give you? </h2>
            <div>
                <input type="radio" name="q4" id="q41" value="classic">
                <label for="q41">A new way to think about life</label>
            </div>
            <div>
                <input type="radio" name="q4" id="q42" value="history">
                <label for="q42">A better understanding of the past</label>
            </div>
            <div>
                <input type="radio" name="q4" id="q43" value="poetry">
                <label for="q43">A strong emotional impression</label>
            </div>

            <div>
                <button type="button" id="button42">Back</button>
                <button type="button" id="button4">Next</button>

            </div>
        </div>
    </form>
    <form id="f5que">
        <div class="step5" id="step5">
            <h2 id="question5"> 5. Which style do you like most?</h2>
            <div>
                <input type="radio" name="q5" id="q51" value="classic">
                <label for="q51">Deep and literary</label>
            </div>

            <div>
                <input type="radio" name="q5" id="q52" value="history">
                <label for="q52">Narrative and realistic</label>
            </div>

            <div>
                <input type="radio" name="q5" id="q53" value="poetry">
                <label for="q53">Expressive and poetic</label>
            </div>
            <div>
                <button type="button" id="button52">Back</button>
                <button type="button" id="button5">Find my Book</button>
                <!--(brauchen wir hier submit??)-->

            </div>
        </div>

    </form>
    <div id="result" style="display: none;">

        <h2 id="resultTitle"></h2>
        <div id="books"></div>


    </div>
    <script src="quiz.js"></script>


</body>

</html>
